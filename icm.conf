[server]
# 바인딩 주소 (0.0.0.0 = 모든 인터페이스, 127.0.0.1 = 로컬호스트만)
host = 0.0.0.0
# 수신 포트
port = 8080

[logging]
# 로그 레벨: error | warn | info | debug | trace
level = info

[database]
# SQLite DB 파일 경로
path = ./icm.db

[paths]
# DRBD 리소스 파일 디렉토리
drbd_dir = /etc/drbd.d
# Quadlet 네트워크 파일 디렉토리
quadlet_dir = /etc/containers/systemd
# 테스트용 임시 파일 디렉토리
temp_dir = /tmp/icm
# 배포 모드: live | test (test 이면 temp_dir 에 파일을 씀)
deploy_mode = test

[pacemaker]
# pcsd REST API URL
pcsd_url = https://localhost:2224
# pcsd 인증 사용자 (hacluster 등)
pcsd_user = hacluster
# pcsd 인증 비밀번호 (빈 값이면 pcsd 스캔 건너뜀)
pcsd_password =
