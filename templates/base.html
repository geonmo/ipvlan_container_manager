<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HA Container Manager{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/theme/material-darker.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-hdd-network-fill text-warning"></i> HA Container Manager
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-3">
        <li class="nav-item">
          <a class="nav-link {% block nav_nodes %}{% endblock %}" href="/nodes/">
            <i class="bi bi-server"></i> 노드 풀
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% block nav_drbd %}{% endblock %}" href="/drbd/">
            <i class="bi bi-database-fill"></i> DRBD 설정
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% block nav_volume %}{% endblock %}" href="/volume/">
            <i class="bi bi-hdd-stack-fill"></i> Volume 설정
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% block nav_quadlet %}{% endblock %}" href="/quadlet/">
            <i class="bi bi-box-seam-fill"></i> Pod 설정
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% block nav_nft %}{% endblock %}" href="/nft/">
            <i class="bi bi-shield-fill-check"></i> 방화벽
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% block nav_container %}{% endblock %}" href="/container/">
            <i class="bi bi-boxes"></i> 컨테이너 설정
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% block nav_pacemaker %}{% endblock %}" href="/pacemaker/">
            <i class="bi bi-heart-pulse-fill"></i> Pacemaker 설정
          </a>
        </li>
      </ul>
      <div class="ms-auto">
        <span class="badge bg-secondary">RHEL9 / AlmaLinux9</span>
      </div>
    </div>
  </div>
</nav>

<div class="container-fluid py-4">
  {% block content %}{% endblock %}
</div>

<footer class="border-top mt-5 py-3 bg-white text-center text-muted small">
  DRBD + Quadlet + Pacemaker 설정 도우미 &mdash; RHEL9 / AlmaLinux9 HA Cluster
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/yaml/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/shell/shell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/javascript/javascript.min.js"></script>
<script src="/static/js/main.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
